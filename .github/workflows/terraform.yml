# ==============================================================================
# Terraform CI/CD Workflow (Starter Version)
# ==============================================================================
# This workflow demonstrates:
# - Pull Request validation
# - Push-to-main deployment
# - Azure Login using OIDC
# - Terraform fmt/init/validate/plan
# - Gitleaks secret scanning
# - Infracost cost estimation
# - Artifact upload
# - Conditional terraform apply
#
# NOTE:
# This is a starter workflow intended for learning and extension.
# ==============================================================================

name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write # Required for Azure OIDC
  contents: read # Required to checkout repository
  pull-requests: write # Allows PR comments (e.g. Infracost)

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.13.1"
  TF_WORKING_DIR: environment/dev

jobs:
  terraform:
    name: Terraform Validation & Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Install Terraform CLI
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------------------------
      # Login to Azure using OIDC
      # Requires:
      # AZURE_CLIENT_ID
      # AZURE_TENANT_ID
      # AZURE_SUBSCRIPTION_ID
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Initialize Terraform
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------------------------------------------
      # Check formatting
      # -----------------------------------------------------------------------
      - name: Terraform Format
        run: terraform fmt -check -recursive
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Validate configuration
      # -----------------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------------------------------------------
      # Scan repository for hardcoded secrets
      # -----------------------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Generate Terraform execution plan
      # -----------------------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      #######################################################################
      # Setup Infracost CLI
      #
      # Installs the Infracost CLI on the GitHub runner.
      #
      # The API key (or CLI authentication token, depending on your account)
      # is stored securely in GitHub Secrets.
      #
      # Required GitHub Secret:
      #   INFRACOST_API_KEY
      #######################################################################
      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      #######################################################################
      # Verify Installed Version
      #
      # Prints the CLI version.
      #
      # This helps determine whether the installed CLI supports
      # 'scan' or only the older 'breakdown' command.
      #######################################################################
      - name: Check Infracost Version
        run: |
          infracost --version

      #######################################################################
      # Generate Cost Estimate
      #
      # Runs inside the Terraform working directory.
      #
      # If your CLI supports 'scan', use the first command.
      # If not, replace 'scan' with 'breakdown'.
      #######################################################################
      - name: Generate Cost Estimate
        env:
          TF_WORKING_DIR: environment/dev
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          
          infracost scan \
            --format json \
            --out-file infracost.json

      #######################################################################
      # Display Cost Report
      #
      # Prints a human-readable table in the GitHub Actions log.
      #######################################################################
      - name: Show Cost Report
        run: |
          cd environment/dev

          infracost output \
            --path infracost.json \
            --format table

      #######################################################################
      # Upload Cost Report
      #
      # Uploads the JSON report as a workflow artifact so it can
      # be downloaded later from GitHub Actions.
      #######################################################################
      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          path: environment/dev/infracost.json
          retention-days: 7      
# -----------------------------------------------------------------------
        # Upload plan and cost report for PR review
# -----------------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-artifacts
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/infracost.json
          retention-days: 7

      # -----------------------------------------------------------------------
      # Apply infrastructure ONLY after merge to main.
      # This step is skipped for Pull Requests.
      # -----------------------------------------------------------------------
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
